# Dependabot meldet Sicherheitsluecken und schlaegt Updates als Pull Request vor.
# Jeder PR laeuft durch den Workflow - einschliesslich der Lizenzpruefung
# (tools/check-licenses.py). Aendert ein Paket seine Lizenz, faellt das dort auf.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Avalonia-Pakete nur gemeinsam aktualisieren, sonst passen sie nicht zusammen.
      avalonia:
        patterns:
          - "Avalonia*"
    ignore:
      # SkiaSharp muss exakt der Version entsprechen, die Avalonia.Skia mitbringt
      # (verwalteter und nativer Teil). Wird von Hand mit Avalonia angehoben.
      - dependency-name: "SkiaSharp"
      # Avalonia 12 hat Breaking Changes - Umstieg bewusst von Hand.
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
